name: Update PM2.5 data

on:
  schedule:
    # Every day at 03:17 UTC (08:17 Pakistan time).
    # To refresh more often, e.g. every 6 hours, use: "17 */6 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write      # needed to commit data/pm25.json back to the repository

concurrency:
  group: update-pm25
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch PM2.5 data from OpenAQ
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python scripts/fetch_pm25.py

      - name: Commit the new data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pm25.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PM2.5 data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
